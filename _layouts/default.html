<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}"/>
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "SunnySide IT Support",
    "description": "Friendly tech help for seniors - patient, plain-spoken help at your pace. In-home & remote help in the Atlanta area.",
    "url": "https://sunnysideit.support/",
    "telephone": "+1-678-561-3435",
    "email": "sunnyside@headlinework.com",
    "areaServed": {
      "@type": "City",
      "name": "Atlanta"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Atlanta",
      "addressRegion": "GA",
      "addressCountry": "US"
    },
    "makesOffer": [
      {
        "@type": "Offer",
        "itemOffered": { "@type": "Service", "name": "Home Visit Tech Help" }
      },
      {
        "@type": "Offer",
        "itemOffered": { "@type": "Service", "name": "Remote Tech Help" }
      },
      {
        "@type": "Offer",
        "itemOffered": { "@type": "Service", "name": "Family Package" }
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="{{ 'assets/css/style.css' | relative_url }}"/>
</head>
<body>
  {% include header.html %}
  <main id="content" class="site-content container" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <!-- SunnySide mailing list opt-in popup -->
  <style>
    .ss-popup-overlay { position: fixed; inset: 0; background: rgba(17, 17, 17, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
    .ss-popup-overlay.ss-popup-visible { display: flex; }
    .ss-popup-box { position: relative; background: #ffffff; color: #111111; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; line-height: 1.6; max-width: 520px; width: 100%; border: 3px solid #F2A007; border-radius: 16px; padding: 28px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); box-sizing: border-box; }
    .ss-popup-box h2 { color: #173F5F; font-size: 2rem; line-height: 1.2; margin: 0 32px 12px 0; }
    .ss-popup-box p { font-size: 1.15rem; margin: 0 0 18px; }
    .ss-popup-box label { display: block; font-size: 1.05rem; font-weight: 600; margin: 14px 0 6px; }
    .ss-popup-box input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 1.15rem; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 12px; }
    .ss-popup-box input:focus { outline: 3px solid #F2A007; border-color: #173F5F; }
    .ss-popup-submit { display: block; width: 100%; margin-top: 20px; background: #173F5F; color: #ffffff; font-family: inherit; font-size: 1.15rem; font-weight: 600; padding: 12px 14px; border: 1px solid #173F5F; border-radius: 999px; cursor: pointer; }
    .ss-popup-close { position: absolute; top: 8px; right: 12px; background: transparent; border: none; color: #173F5F; font-size: 2rem; line-height: 1; padding: 8px; cursor: pointer; }
    .ss-popup-dismiss { display: block; text-align: center; color: #173F5F; font-size: 1.05rem; margin-top: 14px; text-decoration: underline; cursor: pointer; background: none; border: none; width: 100%; font-family: inherit; }
    @media (max-width: 600px) { .ss-popup-box { padding: 22px; font-size: 18px; } .ss-popup-box h2 { font-size: 1.7rem; } }
  </style>
  <div id="ss-popup" class="ss-popup-overlay" role="dialog" aria-modal="true" aria-labelledby="ss-popup-heading" hidden>
    <div class="ss-popup-box" id="ss-popup-content">
      <button type="button" class="ss-popup-close" id="ss-popup-close" aria-label="Close">&times;</button>
      <h2 id="ss-popup-heading">Free Tech Tips for Seniors</h2>
      <p>Join the SunnySide mailing list for simple, scam-smart tech tips, sent in plain language at your pace.</p>
      <form id="ss-popup-form" novalidate>
        <label for="ss-popup-email">Email</label>
        <input type="email" id="ss-popup-email" name="email" required autocomplete="email" placeholder="you@example.com">
        <label for="ss-popup-first-name">First name (optional)</label>
        <input type="text" id="ss-popup-first-name" name="first-name" autocomplete="given-name" placeholder="Your first name">
        <button type="submit" class="ss-popup-submit">Subscribe</button>
      </form>
      <button type="button" class="ss-popup-dismiss" id="ss-popup-dismiss">No thanks</button>
    </div>
  </div>
  <script>
    (function () {
      var KEY = 'ss_popup_seen';
      try { if (window.localStorage.getItem(KEY)) { return; } } catch (e) {}
      var popup = document.getElementById('ss-popup');
      if (!popup) { return; }
      function hidePopup() {
        popup.classList.remove('ss-popup-visible');
        popup.hidden = true;
        try { window.localStorage.setItem(KEY, '1'); } catch (e) {}
      }
      function showPopup() {
        popup.hidden = false;
        popup.classList.add('ss-popup-visible');
        try { window.localStorage.setItem(KEY, '1'); } catch (e) {}
      }
      setTimeout(showPopup, 8000);
      document.getElementById('ss-popup-close').addEventListener('click', hidePopup);
      document.getElementById('ss-popup-dismiss').addEventListener('click', hidePopup);
      popup.addEventListener('click', function (event) { if (event.target === popup) { hidePopup(); } });
      document.getElementById('ss-popup-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var email = document.getElementById('ss-popup-email').value.trim();
        var firstName = document.getElementById('ss-popup-first-name').value.trim();
        if (!email) { document.getElementById('ss-popup-email').focus(); return; }
        var data = new URLSearchParams();
        data.append('entry.1870450067', email);
        data.append('entry.1715945664', firstName);
        fetch('https://docs.google.com/forms/d/e/1FAIpQLSff5huiSgnvlHibUkONv9hHJk3f4n7BQ26-CHe7yfR825ANrg/formResponse', { method: 'POST', mode: 'no-cors', body: data })
          .then(function () { showThanks(); })
          .catch(function () { showThanks(); });
        function showThanks() {
          try { window.localStorage.setItem(KEY, '1'); } catch (e) {}
          var content = document.getElementById('ss-popup-content');
          content.innerHTML = '<button type="button" class="ss-popup-close" id="ss-popup-close-2" aria-label="Close">&times;</button><h2>Thank you!</h2><p>You\'re in! Watch your inbox for simple tech tips from SunnySide.</p>';
          document.getElementById('ss-popup-close-2').addEventListener('click', hidePopup);
        }
      });
    })();
  </script>
</body>
</html>
